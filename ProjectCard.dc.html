<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./image-slot.js"></script>
</helmet>
<div style="position:relative;background:#FFFFFF;border:1px solid #E8E2DB;border-radius:10px;overflow:hidden;cursor:pointer;height:100%;transition:transform .35s cubic-bezier(.16,1,.3,1), box-shadow .35s ease, border-color .35s ease;animation:cardIn .6s cubic-bezier(.16,1,.3,1) both;animation-delay:{{ project.delayMs }}ms;" style-hover="transform:translateY(-8px);box-shadow:0 30px 60px -24px rgba(21,18,15,0.35);border-color:#E8E2DB;" onClick="{{ project.onOpen }}">
  <div style="position:relative;height:100%;min-height:220px;background:linear-gradient(135deg,#221C18 0%,#17130F 55%,#0E0C0A 100%);overflow:hidden;">
    <image-slot id="{{ project.featuredSlotId }}" shape="rect" placeholder="Add a primary image" style="position:absolute;inset:0;width:100%;height:100%;transition:transform .6s cubic-bezier(.16,1,.3,1);" style-hover="transform:scale(1.055);"></image-slot>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,12,10,0) 40%,rgba(14,12,10,0.82) 100%);pointer-events:none;"></div>
    <sc-if value="{{ project.isFeatured }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;top:16px;right:16px;background:#FF6533;color:#fff;font-size:10.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:6px 11px;border-radius:100px;pointer-events:none;z-index:2;">Featured</div>
    </sc-if>
    <div style="position:absolute;top:16px;left:16px;background:rgba(255,255,255,0.14);backdrop-filter:blur(6px);color:#FFE4D6;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:6px 12px;border-radius:100px;pointer-events:none;z-index:2;">{{ project.category }}</div>
    <div style="position:absolute;bottom:0;left:0;right:0;padding:22px 24px;pointer-events:none;z-index:2;">
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(19px,2vw,24px);color:#FFFFFF;line-height:1.18;margin-bottom:8px;">{{ project.title }}</div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <span style="font-size:13px;color:#C9C0B6;font-weight:600;">{{ project.client }}</span>
        <span style="display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:#FF9E7D;">View <span>&#8594;</span></span>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:340}}"></script>
</body>
</html>
