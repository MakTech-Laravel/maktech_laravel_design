<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./image-slot.js"></script>
</helmet>
<div style="background:#FFFFFF;border:1px solid #E8E2DB;border-radius:8px;overflow:hidden;cursor:pointer;transition:transform .25s ease, box-shadow .25s ease;" style-hover="transform:translateY(-6px);box-shadow:0 24px 48px -20px rgba(21,18,15,0.35);" onClick="{{ project.onOpen }}">
  <div style="position:relative;height:220px;background:linear-gradient(135deg,#221C18 0%,#17130F 55%,#0E0C0A 100%);overflow:hidden;">
    <image-slot id="{{ project.featuredSlotId }}" shape="rect" placeholder="Add a primary image" style="position:absolute;inset:0;width:100%;height:100%;"></image-slot>
    <div style="position:absolute;top:0;right:0;width:130px;height:130px;background:#FF6533;clip-path:polygon(100% 0,100% 100%,0 0);opacity:0.92;pointer-events:none;"></div>
    <div style="position:absolute;top:16px;left:16px;background:rgba(255,255,255,0.14);backdrop-filter:blur(6px);color:#FFE4D6;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:6px 12px;border-radius:100px;pointer-events:none;">{{ project.category }}</div>
    <div style="position:absolute;bottom:0;left:0;right:0;padding:20px 22px;background:linear-gradient(0deg,rgba(14,12,10,0.8) 0%,rgba(14,12,10,0) 65%);pointer-events:none;">
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;color:#FFFFFF;line-height:1.16;">{{ project.title }}</div>
    </div>
  </div>
  <div style="padding:18px 22px 22px;display:flex;flex-direction:column;gap:8px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <span style="font-size:14px;color:#6B645C;font-weight:600;">{{ project.client }}</span>
      <span style="font-size:12px;color:#A79D93;">{{ project.date }}</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#FF6533;">
      <span>View case study</span><span>&#8594;</span>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:380}}"></script>
</body>
</html>
